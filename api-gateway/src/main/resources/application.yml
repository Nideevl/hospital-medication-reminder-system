spring:
  application:
    name: api-gateway
  
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://patient-service:8081
          predicates:
            - Path=/patients/**
        
        - id: schedule-service
          uri: http://schedule-service:8082
          predicates:
            - Path=/schedules/**
        
        - id: call-service
          uri: http://call-service:8083
          predicates:
            - Path=/calls/**
        
        - id: escalation-service
          uri: http://escalation-service:8084
          predicates:
            - Path=/escalations/**
        
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/notifications/**
        
        - id: report-service
          uri: http://report-service:8086
          predicates:
            - Path=/reports/**
        
        - id: audit-service
          uri: http://audit-service:8087
          predicates:
            - Path=/audits/**

server:
  port: 8080

logging:
  level:
    root: INFO
    com.medreminder: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always