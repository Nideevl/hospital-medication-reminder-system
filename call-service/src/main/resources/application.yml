spring:
  application:
    name: call-service
  
  server:
    port: 8083
  
  datasource:
    url: jdbc:postgresql://localhost:5432/med_reminder
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-call-service-master.xml
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      bootstrap-servers: localhost:9092
      group-id: call-service-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: |
          callResponseEvent:com.medreminder.common.dto.CallResponseEvent

grpc:
  server:
    port: 9003
    enable-keep-alive: true
  
  client:
    patient-service:
      host: localhost
      port: 9001
      enable-keep-alive: true
    schedule-service:
      host: localhost
      port: 9002
      enable-keep-alive: true

logging:
  level:
    root: INFO
    com.medreminder: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
