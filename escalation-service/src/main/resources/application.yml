spring:
  application:
    name: escalation-service
  datasource:
    url: jdbc:postgresql://localhost:5432/med_reminder
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: escalation-service-group
      auto-offset-reset: earliest
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8084

logging:
  level:
    root: INFO
    com.medreminder: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
