spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/med_reminder
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest

server:
  port: 8087

logging:
  level:
    root: INFO
    com.medreminder: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
