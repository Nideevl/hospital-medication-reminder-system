spring:
  application:
    name: schedule-service

  datasource:
    url: jdbc:postgresql://localhost:5432/med_reminder
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-schedule.xml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: schedule-service-group
      auto-offset-reset: earliest
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.medreminder.common.dto.CallResponseEvent
    topics:
      medication-due: medication-due
      call-response-received: call-response-received

server:
  port: 8082

grpc:
  server:
    port: 9002
    enable-keep-alive: true

logging:
  level:
    root: INFO
    com.medreminder: DEBUG
    org.springframework.kafka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true